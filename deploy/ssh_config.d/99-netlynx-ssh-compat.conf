# Один набор для всех хостов: дефолты OpenSSH (современные) плюс более старые алгоритмы.
# Клиент предлагает оба набора, устройство выбирает пересечение — без групп по подсетям.
Host *
  KexAlgorithms +diffie-hellman-group-exchange-sha256,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1
  HostKeyAlgorithms +ssh-rsa,ssh-dss
  PubkeyAcceptedAlgorithms +ssh-rsa,ssh-dss
  Ciphers +aes128-cbc,aes192-cbc,aes256-cbc,3des-cbc
  MACs +hmac-sha1,hmac-sha1-96
