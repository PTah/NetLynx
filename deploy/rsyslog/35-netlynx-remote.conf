# NetLynx remote syslog receiver (RainerScript).
# Install: docs/setup-remote-syslog.sh
#
# Design goals vs a typical «bookstack-style» dump:
#  - isolated ruleset (remote never pollutes /var/log/syslog)
#  - path under /var/lib (state data, not ad-hoc /var/log)
#  - one file name per host (syslog.log); rotation is logrotate's job
#  - reception timestamp (RFC3339) + FROMHOST-IP prefix — device clocks lie
#  - no rate-limit on the remote path (forensics during STP/BPDU storms)
#  - large UDP buffer + MaxMessageSize for chatty EdgeSwitch/SNR lines
#  - optional fan-out to local NetLynx MAC syslog (:9514)

global(maxMessageSize="64k")

# Load only if not already loaded by rsyslog.conf (Ubuntu often leaves them commented).
module(load="imudp" threads="2" timeRequery="8")
module(load="imtcp" maxSessions="256")

template(name="NetLynxRemotePath" type="string"
         string="/var/lib/remotelogs/%FROMHOST-IP%/syslog.log")

# Reception time (server clock) + source IP + original payload after PRI.
# Keeps forensics usable when the sender boot clock is 2006-01-01.
template(name="NetLynxRemoteLine" type="list") {
    property(name="timegenerated" dateFormat="rfc3339")
    constant(value=" ")
    property(name="fromhost-ip")
    constant(value=" ")
    property(name="rawmsg-after-pri")
    constant(value="\n")
}

# App fan-out: put real sender IP into RFC3164 HOSTNAME so localhost UDP still maps
# to the device in NetLynx inventory.
template(name="NetLynxAppFwd" type="string"
         string="<%PRI%>%TIMESTAMP% %FROMHOST-IP% %rawmsg-after-pri%\n")

ruleset(name="netlynx_remote") {

    # Archive (always).
    action(
        type="omfile"
        dynaFile="NetLynxRemotePath"
        template="NetLynxRemoteLine"
        dynaFileCacheSize="512"
        dirCreateMode="0750"
        fileCreateMode="0640"
        dirOwner="syslog"
        dirGroup="adm"
        fileOwner="syslog"
        fileGroup="adm"
        # Low-rate devices (EdgeSwitch) must flush every message; otherwise the
        # 64k buffer stays empty on disk until a flood fills it (MikroTik case).
        flushOnTXEnd="on"
        ioBufferSize="4k"
    )

    # Fan-out to NetLynx app syslogrecv (MAC_FLAPPING). Source IP is preserved in the
# HOSTNAME field; netlynxd unwraps loopback UDP and uses that IP (see syslogrecv).
    action(
        type="omfwd"
        target="127.0.0.1"
        port="9514"
        protocol="udp"
        template="NetLynxAppFwd"
        action.resumeRetryCount="0"
        action.resumeInterval="5"
    )

    stop
}

input(type="imudp" port="514" ruleset="netlynx_remote"
      Ratelimit.Interval="0" Ratelimit.Burst="0")
input(type="imtcp" port="514" ruleset="netlynx_remote"
      Ratelimit.Interval="0" Ratelimit.Burst="0")
