# NetLynx — HTTPS reverse proxy (wildcard *.kalinamall.ru).
# Установка: docs/install-nginx-tls.sh
#
# Сертификат с шары (Apache-экспорт, предпочтительно):
#   //192.168.160.185/Soft/Certs/2026/Export/apache/
#     wildcard_kalinamall_ru.crt
#     intermediate_pem_globalsign_ssl_ov_wildcard_1.crt  → склеиваются в fullchain.pem
#     wildcard_kalinamall_ru.key                         → privkey.pem
#
# На сервере после install-nginx-tls.sh:
#   ssl_certificate     /etc/ssl/kalinamall/fullchain.pem
#   ssl_certificate_key /etc/ssl/kalinamall/privkey.pem

server {
    listen 80;
    server_name netlynx.kalinamall.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name netlynx.kalinamall.ru;

    ssl_certificate     /etc/ssl/kalinamall/fullchain.pem;
    ssl_certificate_key /etc/ssl/kalinamall/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NetLynxSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/netlynx.access.log;
    error_log  /var/log/nginx/netlynx.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
