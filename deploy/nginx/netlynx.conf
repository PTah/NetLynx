server {
    listen 192.168.160.121:443 ssl;
    server_name netlynx.kalinamall.ru;

    ssl_certificate     /etc/ssl/kalinamall/fullchain.pem;
    ssl_certificate_key /etc/ssl/kalinamall/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NetLynxSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/netlynx.access.log;
    error_log  /var/log/nginx/netlynx.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
