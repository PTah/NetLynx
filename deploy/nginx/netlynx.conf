# ext / autodiscover на .121 → Exchange (.42)
server {
    listen 192.168.160.121:443 ssl;
    server_name ext.kalinamall.ru autodiscover.kalinamall.ru;
    ssl_certificate     /etc/ssl/kalinamall/fullchain.pem;
    ssl_certificate_key /etc/ssl/kalinamall/privkey.pem;
    location / {
        proxy_pass https://192.168.160.42;
        proxy_ssl_server_name on;
        proxy_ssl_name ext.kalinamall.ru;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
