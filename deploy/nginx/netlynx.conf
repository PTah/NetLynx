# NetLynx — HTTPS reverse proxy (192.168.160.121).
# Только netlynx.kalinamall.ru. Чужие Host — прокси на правильный backend (LAN DNS иногда ведёт на .121).

server {
    listen 80 default_server;
    listen 192.168.160.121:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/ssl/kalinamall/fullchain.pem;
    ssl_certificate_key /etc/ssl/kalinamall/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name netlynx.kalinamall.ru;
    return 301 https://$host$request_uri;
}

# git.kalinamall.ru на .121 → Gitea (.129)
server {
    listen 192.168.160.121:443 ssl;
    server_name git.kalinamall.ru;
    ssl_certificate     /etc/ssl/kalinamall/fullchain.pem;
    ssl_certificate_key /etc/ssl/kalinamall/privkey.pem;
    location / {
        proxy_pass https://192.168.160.129;
        proxy_ssl_server_name on;
        proxy_ssl_name git.kalinamall.ru;
        proxy_set_header Host git.kalinamall.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

