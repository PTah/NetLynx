# NetLynx — HTTPS reverse proxy (10.0.0.1).
# Только netlynx.example.com. Чужие Host — прокси на правильный backend (LAN DNS иногда ведёт на .121).

server {
    listen 80 default_server;
    listen 10.0.0.1:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name netlynx.example.com;
    return 301 https://$host$request_uri;
}

# git.example.com на .121 → Gitea (.129)
server {
    listen 10.0.0.1:443 ssl;
    server_name git.example.com;
    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;
    location / {
        proxy_pass https://10.0.0.1;
        proxy_ssl_server_name on;
        proxy_ssl_name git.example.com;
        proxy_set_header Host git.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# sac.example.com на .121 → SAC (.145)
server {
