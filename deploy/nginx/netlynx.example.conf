# NetLynx — пример reverse proxy (nginx).
# Подставьте SERVER_NAME, пути к сертификатам; установка: docs/install-nginx.sh

# HTTP → HTTPS (раскомментируйте при TLS)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name SERVER_NAME;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Для HTTPS раскомментируйте блок listen 443 ниже и закомментируйте listen 80.

    access_log /var/log/nginx/netlynx.access.log;
    error_log  /var/log/nginx/netlynx.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

